apply plugin: 'com.android.application'

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('../keystore.properties')
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

def signingValue = { String propertyName, String environmentName ->
    signingProperties.getProperty(propertyName) ?: System.getenv(environmentName)
}

def releaseStoreFile = signingValue('storeFile', 'RPHUB_RELEASE_STORE_FILE')
def releaseStorePassword = signingValue('storePassword', 'RPHUB_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = signingValue('keyAlias', 'RPHUB_RELEASE_KEY_ALIAS')
def releaseKeyPassword = signingValue('keyPassword', 'RPHUB_RELEASE_KEY_PASSWORD')
def hasReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it }
def releaseVersionName = System.getenv('RPHUB_VERSION_NAME') ?: '1.8.7.1'
def releaseVersionCode = (System.getenv('RPHUB_VERSION_CODE') ?: '1080701').toInteger()

android {
    namespace "io.github.pq125.rphub"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.pq125.rphub"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode releaseVersionCode
        versionName releaseVersionName
        manifestPlaceholders = [appLabel: 'RP Hub']
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            manifestPlaceholders = [appLabel: 'RP Hub Debug']
        }
        release {
            debuggable false
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    applicationVariants.configureEach { variant ->
        if (variant.buildType.name == 'release' && !hasReleaseSigning) {
            variant.assembleProvider.configure {
                doFirst {
                    throw new GradleException('Release signing is not configured. Copy keystore.properties.example to keystore.properties or set the RPHUB_RELEASE_* environment variables.')
                }
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
