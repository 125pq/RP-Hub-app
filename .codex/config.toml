# Project-level Codex settings for RP-Hub-app.
#
# Intentionally minimal: it only registers the two delegation roles. No model name
# is pinned anywhere, so switching the main model or the upstream API provider
# requires no change to this file.

[agents.worker]
description = "High-volume Worker: reads code, searches, ordinary coding, small bug fixes, runs builds and tests. Delegate here first, with the cheapest capable model available."
config_file = "~/.codex/agents/worker.toml"

[agents.reviewer]
description = "Read-only Reviewer: quality gate for medium and high risk changes only. Spawn with a strong reasoning model."
config_file = "~/.codex/agents/reviewer.toml"
