name: Sync upstream RP-Hub

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: write

concurrency:
  group: sync-upstream-latest-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          npm ci
          npm audit --omit=dev

      - name: Configure permanent release signing key
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RPHUB_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RPHUB_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RPHUB_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RPHUB_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rphub-release.jks"
          {
            echo "RPHUB_RELEASE_STORE_FILE=$RUNNER_TEMP/rphub-release.jks"
            echo "RPHUB_RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
            echo "RPHUB_RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "RPHUB_RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Fetch, merge, and reapply categorized hooks
        id: upstream_sync
        run: node scripts/upstream-sync/sync-upstream.mjs --prepare-only

      - name: Prepare Android release metadata
        id: android_release
        run: node scripts/upstream-sync/prepare-android-release.mjs "${{ steps.upstream_sync.outputs.release_tag }}"

      - name: Verify adapter and upstream hooks
        run: npm run test:upstream-sync

      - name: Run JavaScript and Web tests
        run: |
          npm run test:platform
          npm run test:performance
          npm run build:web
          npm run verify:dist

      - name: Sync Capacitor and build Android release
        env:
          RPHUB_VERSION_NAME: ${{ steps.android_release.outputs.version_name }}
          RPHUB_VERSION_CODE: ${{ steps.android_release.outputs.version_code }}
        run: |
          npx cap sync android
          bash android/gradlew --project-dir android testDebugUnitTest assembleRelease

      - name: Verify and package signed APK
        id: apk
        shell: bash
        env:
          VERSION_NAME: ${{ steps.android_release.outputs.version_name }}
          VERSION_CODE: ${{ steps.android_release.outputs.version_code }}
          APK_NAME: ${{ steps.android_release.outputs.apk_name }}
        run: |
          source_apk="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$source_apk"
          output_apk="$RUNNER_TEMP/$APK_NAME"
          cp "$source_apk" "$output_apk"

          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner_path"
          "$apksigner_path" verify --verbose --print-certs "$output_apk"

          apkanalyzer_path="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test -x "$apkanalyzer_path"
          test "$("$apkanalyzer_path" manifest application-id "$output_apk")" = "io.github.pq125.rphub"
          test "$("$apkanalyzer_path" manifest version-name "$output_apk")" = "$VERSION_NAME"
          test "$("$apkanalyzer_path" manifest version-code "$output_apk")" = "$VERSION_CODE"
          test "$("$apkanalyzer_path" manifest debuggable "$output_apk")" = "false"

          apk_sha256="$(sha256sum "$output_apk" | cut -d ' ' -f 1)"
          echo "apk_path=$output_apk" >> "$GITHUB_OUTPUT"
          echo "sha256=$apk_sha256" >> "$GITHUB_OUTPUT"
          echo "APK_SHA256=$apk_sha256"

      - name: Prepare mirrored release notes
        id: release_notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APK_SHA256: ${{ steps.apk.outputs.sha256 }}
          UPSTREAM_RELEASE_TAG: ${{ steps.upstream_sync.outputs.release_tag }}
        run: |
          upstream_notes="$(gh api "repos/STA1N156/RP-Hub/releases/tags/${UPSTREAM_RELEASE_TAG}" --jq '.body // ""')"
          notes_file="$RUNNER_TEMP/android-release-notes.md"
          {
            echo "## 上游 RP-Hub ${UPSTREAM_RELEASE_TAG} 更新说明"
            echo
            printf '%s\n' "$upstream_notes"
            echo
            echo "## Android 构建说明"
            echo
            echo "- Android / Capacitor 封装"
            echo "- 本地离线运行依赖"
            echo "- SAF 文件导入与导出"
            echo "- Android safe-area、Back、Share、Browser 适配"
            echo "- paragraph-aware streaming 性能优化"
            echo "- 复杂 UI 角色卡离屏动画暂停，改善长聊天滚动性能"
            echo "- 使用永久 release key 签名"
            echo
            echo "已知问题：默认 Capacitor 图标及少量 UX polish 后续处理。"
            echo
            echo "## APK 校验"
            echo
            echo "APK SHA-256：\`$APK_SHA256\`"
          } > "$notes_file"
          echo "notes_path=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Check final diff
        run: |
          git diff --check
          git diff --cached --check

      - name: Commit and push successful sync
        shell: bash
        env:
          UPSTREAM_RELEASE_TAG: ${{ steps.upstream_sync.outputs.release_tag }}
          UPSTREAM_SHA: ${{ steps.upstream_sync.outputs.upstream_sha }}
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No upstream changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(sync): merge upstream RP-Hub release ${UPSTREAM_RELEASE_TAG} (${UPSTREAM_SHA:0:7}) and reapply local patches"
          git push origin HEAD:main

      - name: Publish Android GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_TAG: ${{ steps.android_release.outputs.android_tag }}
          RELEASE_TITLE: ${{ steps.android_release.outputs.title }}
          VERSION_NAME: ${{ steps.android_release.outputs.version_name }}
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
          APK_SHA256: ${{ steps.apk.outputs.sha256 }}
          UPSTREAM_RELEASE_TAG: ${{ steps.upstream_sync.outputs.release_tag }}
          RELEASE_NOTES_PATH: ${{ steps.release_notes.outputs.notes_path }}
        run: |
          if gh release view "$ANDROID_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Android Release $ANDROID_TAG already exists; skipping duplicate publication"
            exit 0
          fi

          gh release create "$ANDROID_TAG" "$APK_PATH" \
            --repo "${{ github.repository }}" \
            --target "$(git rev-parse HEAD)" \
            --title "$RELEASE_TITLE" \
            --notes-file "$RELEASE_NOTES_PATH" \
            --latest

      - name: Publish Android Release mirror to Gitee
        timeout-minutes: 15
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_USERNAME: pq125pq
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
          APK_NAME: ${{ steps.android_release.outputs.apk_name }}
          ANDROID_TAG: ${{ steps.android_release.outputs.android_tag }}
          RELEASE_TITLE: ${{ steps.android_release.outputs.title }}
          RELEASE_NOTES_PATH: ${{ steps.release_notes.outputs.notes_path }}
        run: |
          test -n "$GITEE_TOKEN"
          askpass="$RUNNER_TEMP/gitee-askpass.sh"
          printf '%s\n' \
            '#!/bin/sh' \
            'case "$1" in' \
            '  *Username*) printf "%s\\n" "$GITEE_USERNAME" ;;' \
            '  *Password*) printf "%s\\n" "$GITEE_TOKEN" ;;' \
            '  *) exit 1 ;;' \
            'esac' > "$askpass"
          chmod 700 "$askpass"

          if ! git ls-remote --exit-code https://gitee.com/pq125pq/rp-hub-app.git refs/heads/main >/dev/null 2>&1; then
            bootstrap_dir="$RUNNER_TEMP/gitee-bootstrap"
            mkdir -p "$bootstrap_dir"
            git -C "$bootstrap_dir" init
            git -C "$bootstrap_dir" checkout -b main
            git -C "$bootstrap_dir" config user.name "github-actions[bot]"
            git -C "$bootstrap_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            printf '%s\n' '# RP-Hub Android 国内更新镜像' > "$bootstrap_dir/README.md"
            git -C "$bootstrap_dir" add README.md
            git -C "$bootstrap_dir" commit -m "chore: initialize Android release mirror"
            git -C "$bootstrap_dir" remote add gitee https://gitee.com/pq125pq/rp-hub-app.git
            GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
              git -C "$bootstrap_dir" push gitee HEAD:refs/heads/main
          fi

          api="https://gitee.com/api/v5/repos/pq125pq/rp-hub-app"
          release_json="$RUNNER_TEMP/gitee-release.json"
          status="$(curl --silent --show-error --output "$release_json" --write-out '%{http_code}' \
            --connect-timeout 20 --max-time 60 \
            --header "Authorization: Bearer $GITEE_TOKEN" \
            "$api/releases/tags/$ANDROID_TAG")"

          if [ "$status" = "404" ] || { [ "$status" = "200" ] && ! jq -e 'type == "object" and .id != null' "$release_json" >/dev/null; }; then
            curl --silent --show-error --fail-with-body \
              --connect-timeout 20 --max-time 60 \
              --header "Authorization: Bearer $GITEE_TOKEN" \
              --request POST \
              --data-urlencode "tag_name=$ANDROID_TAG" \
              --data-urlencode "name=$RELEASE_TITLE" \
              --data-urlencode "body@$RELEASE_NOTES_PATH" \
              --data-urlencode "target_commitish=main" \
              --data-urlencode "prerelease=false" \
              "$api/releases" > "$release_json"
          elif [ "$status" != "200" ]; then
            echo "Gitee Release query failed (HTTP $status)" >&2
            exit 1
          fi

          release_id="$(jq -er '.id' "$release_json")"
          if jq -e --arg name "$APK_NAME" '.assets[]? | select(.name == $name)' "$release_json" >/dev/null; then
            echo "Gitee Release $ANDROID_TAG already contains $APK_NAME"
            exit 0
          fi

          asset_json="$RUNNER_TEMP/gitee-asset.json"
          curl --silent --show-error --fail-with-body \
            --connect-timeout 20 --max-time 600 \
            --header "Authorization: Bearer $GITEE_TOKEN" \
            --form "file=@$APK_PATH;type=application/vnd.android.package-archive" \
            "$api/releases/$release_id/attach_files" > "$asset_json"
          jq -e --arg name "$APK_NAME" \
            '.name == $name and (.browser_download_url | startswith("https://gitee.com/"))' \
            "$asset_json" >/dev/null
