name: Sync upstream RP-Hub

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Android release revision (0-99). Leave blank to auto-derive from package.json.'
        required: false
        type: string
        default: ''
      notes:
        description: 'Optional custom Android release notes (markdown). Overrides the CHANGELOG hotfix section when provided.'
        required: false
        type: string
        default: ''
  schedule:
    - cron: '17 2 * * *'
  repository_dispatch:
    types:
      - upstream-release

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream-latest-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fetch, merge, and reapply categorized hooks
        id: upstream_sync
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RPHUB_CHECK_PUBLICATION: 'true'
          RPHUB_ANDROID_REVISION: ${{ inputs.revision }}
        run: node scripts/upstream-sync/sync-upstream.mjs --prepare-only

      - name: Report no new upstream release
        if: steps.upstream_sync.outputs.has_updates != 'true'
        run: echo "No new upstream release; sync completed successfully without building or publishing."

      - uses: actions/setup-java@v4
        if: steps.upstream_sync.outputs.has_updates == 'true'
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3
        if: steps.upstream_sync.outputs.has_updates == 'true'

      - name: Install dependencies
        if: steps.upstream_sync.outputs.has_updates == 'true'
        run: |
          npm ci
          npm audit --omit=dev

      - name: Configure permanent release signing key
        if: steps.upstream_sync.outputs.has_updates == 'true'
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RPHUB_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RPHUB_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RPHUB_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RPHUB_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rphub-release.jks"
          {
            echo "RPHUB_RELEASE_STORE_FILE=$RUNNER_TEMP/rphub-release.jks"
            echo "RPHUB_RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
            echo "RPHUB_RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "RPHUB_RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Prepare Android release metadata
        id: android_release
        if: steps.upstream_sync.outputs.has_updates == 'true'
        run: node scripts/upstream-sync/prepare-android-release.mjs "${{ steps.upstream_sync.outputs.release_tag }}" "${{ steps.upstream_sync.outputs.revision }}"

      - name: Verify adapter and upstream hooks
        if: steps.upstream_sync.outputs.has_updates == 'true'
        run: npm run test:upstream-sync

      - name: Run JavaScript and Web tests
        if: steps.upstream_sync.outputs.has_updates == 'true'
        run: |
          npm run test:platform
          npm run test:performance
          npm run build:web
          npm run verify:dist

      - name: Sync Capacitor and build Android release
        if: steps.upstream_sync.outputs.has_updates == 'true'
        env:
          RPHUB_VERSION_NAME: ${{ steps.android_release.outputs.version_name }}
          RPHUB_VERSION_CODE: ${{ steps.android_release.outputs.version_code }}
        run: |
          npx cap sync android
          bash android/gradlew --project-dir android testDebugUnitTest assembleRelease

      - name: Verify and package signed APK
        id: apk
        if: steps.upstream_sync.outputs.has_updates == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.android_release.outputs.version_name }}
          VERSION_CODE: ${{ steps.android_release.outputs.version_code }}
          ANDROID_TAG: ${{ steps.android_release.outputs.android_tag }}
          APK_NAME: ${{ steps.android_release.outputs.apk_name }}
          SYNC_MODE: ${{ steps.upstream_sync.outputs.sync_mode }}
          UPSTREAM_SHA: ${{ steps.upstream_sync.outputs.upstream_sha }}
        run: |
          source_apk="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$source_apk"
          output_apk="$RUNNER_TEMP/$APK_NAME"
          if gh release view "$ANDROID_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            if [ "$SYNC_MODE" != "recover" ]; then
              echo "Android Release $ANDROID_TAG already exists during sync mode $SYNC_MODE; refusing to reuse it" >&2
              exit 1
            fi
            current_head="$(git rev-parse HEAD)"
            release_target="$(gh release view "$ANDROID_TAG" --repo "${{ github.repository }}" --json targetCommitish --jq '.targetCommitish')"
            if [[ ! "$release_target" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
              echo "Android Release $ANDROID_TAG has invalid target $release_target; refusing recovery" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$UPSTREAM_SHA" "$release_target"; then
              echo "Upstream release $UPSTREAM_SHA is not an ancestor of Android Release $ANDROID_TAG target $release_target; refusing recovery" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$release_target" "$current_head"; then
              echo "Android Release $ANDROID_TAG targets $release_target, which is not an ancestor of current HEAD $current_head; refusing recovery" >&2
              exit 1
            fi
            gh release download "$ANDROID_TAG" \
              --repo "${{ github.repository }}" \
              --pattern "$APK_NAME" \
              --output "$output_apk" \
              --clobber
            echo "Using canonical APK from existing GitHub Release $ANDROID_TAG"
          else
            cp "$source_apk" "$output_apk"
          fi

          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner_path"
          "$apksigner_path" verify --verbose --print-certs "$output_apk"

          apkanalyzer_path="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test -x "$apkanalyzer_path"
          test "$("$apkanalyzer_path" manifest application-id "$output_apk")" = "io.github.pq125.rphub"
          test "$("$apkanalyzer_path" manifest version-name "$output_apk")" = "$VERSION_NAME"
          test "$("$apkanalyzer_path" manifest version-code "$output_apk")" = "$VERSION_CODE"
          test "$("$apkanalyzer_path" manifest debuggable "$output_apk")" = "false"

          apk_sha256="$(sha256sum "$output_apk" | cut -d ' ' -f 1)"
          echo "apk_path=$output_apk" >> "$GITHUB_OUTPUT"
          echo "sha256=$apk_sha256" >> "$GITHUB_OUTPUT"
          echo "APK_SHA256=$apk_sha256"

      - name: Prepare mirrored release notes
        id: release_notes
        if: steps.upstream_sync.outputs.has_updates == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APK_SHA256: ${{ steps.apk.outputs.sha256 }}
          UPSTREAM_RELEASE_TAG: ${{ steps.upstream_sync.outputs.release_tag }}
          VERSION_NAME: ${{ steps.android_release.outputs.version_name }}
          CUSTOM_NOTES: ${{ inputs.notes }}
        run: |
          upstream_notes="$(gh api "repos/STA1N156/RP-Hub/releases/tags/${UPSTREAM_RELEASE_TAG}" --jq '.body // ""')"
          notes_file="$RUNNER_TEMP/android-release-notes.md"

          changelog_file="$GITHUB_WORKSPACE/CHANGELOG.md"
          hotfix_section=""
          if [ -n "$CUSTOM_NOTES" ]; then
            hotfix_section="$CUSTOM_NOTES"
          elif [ -f "$changelog_file" ]; then
            hotfix_section="$(awk -v ver="$VERSION_NAME" '
              { sub(/\r$/, "") }
              /^## / { in_section = ($0 == ("## " ver)); next }
              in_section { print }
            ' "$changelog_file")"
          fi

          {
            echo "## 上游 RP-Hub ${UPSTREAM_RELEASE_TAG} 更新说明"
            echo
            printf '%s\n' "$upstream_notes"
            echo
            if [ -n "$hotfix_section" ]; then
              echo "## Android 本次更新 (${VERSION_NAME})"
              echo
              printf '%s\n' "$hotfix_section"
              echo
            fi
            echo "## APK 校验"
            echo
            echo "APK SHA-256：\`$APK_SHA256\`"
          } > "$notes_file"
          echo "notes_path=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Check final diff
        if: steps.upstream_sync.outputs.has_updates == 'true'
        run: |
          git diff --check
          git diff --cached --check

      - name: Commit and push successful sync
        if: steps.upstream_sync.outputs.has_updates == 'true'
        shell: bash
        env:
          UPSTREAM_RELEASE_TAG: ${{ steps.upstream_sync.outputs.release_tag }}
          UPSTREAM_SHA: ${{ steps.upstream_sync.outputs.upstream_sha }}
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No upstream changes to commit"
            exit 0
          fi
          git add -A
          git commit -m "chore(sync): merge upstream RP-Hub release ${UPSTREAM_RELEASE_TAG} (${UPSTREAM_SHA:0:7}) and reapply local patches"
          git push origin HEAD:main

      - name: Publish Android GitHub Release
        if: steps.upstream_sync.outputs.has_updates == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_TAG: ${{ steps.android_release.outputs.android_tag }}
          RELEASE_TITLE: ${{ steps.android_release.outputs.title }}
          VERSION_NAME: ${{ steps.android_release.outputs.version_name }}
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
          APK_SHA256: ${{ steps.apk.outputs.sha256 }}
          UPSTREAM_RELEASE_TAG: ${{ steps.upstream_sync.outputs.release_tag }}
          RELEASE_NOTES_PATH: ${{ steps.release_notes.outputs.notes_path }}
          SYNC_MODE: ${{ steps.upstream_sync.outputs.sync_mode }}
          UPSTREAM_SHA: ${{ steps.upstream_sync.outputs.upstream_sha }}
        run: |
          if gh release view "$ANDROID_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            if [ "$SYNC_MODE" = "recover" ]; then
              current_head="$(git rev-parse HEAD)"
              release_target="$(gh release view "$ANDROID_TAG" --repo "${{ github.repository }}" --json targetCommitish --jq '.targetCommitish')"
              if [[ ! "$release_target" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
                echo "Android Release $ANDROID_TAG has invalid target $release_target; refusing recovery" >&2
                exit 1
              fi
              if ! git merge-base --is-ancestor "$UPSTREAM_SHA" "$release_target"; then
                echo "Upstream release $UPSTREAM_SHA is not an ancestor of Android Release $ANDROID_TAG target $release_target; refusing recovery" >&2
                exit 1
              fi
              if ! git merge-base --is-ancestor "$release_target" "$current_head"; then
                echo "Android Release $ANDROID_TAG targets $release_target, which is not an ancestor of current HEAD $current_head; refusing recovery" >&2
                exit 1
              fi
              echo "Android Release $ANDROID_TAG already exists; skipping duplicate recovery publication"
              exit 0
            fi
            echo "Android Release $ANDROID_TAG appeared during sync mode $SYNC_MODE; refusing to skip publication" >&2
            exit 1
          fi

          gh release create "$ANDROID_TAG" "$APK_PATH" \
            --repo "${{ github.repository }}" \
            --target "$(git rev-parse HEAD)" \
            --title "$RELEASE_TITLE" \
            --notes-file "$RELEASE_NOTES_PATH" \
            --latest

      - name: Publish APK branch and trigger Gitee mirror pull
        if: steps.upstream_sync.outputs.has_updates == 'true'
        timeout-minutes: 10
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITHUB_PUSH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
          APK_NAME: ${{ steps.android_release.outputs.apk_name }}
          ANDROID_TAG: ${{ steps.android_release.outputs.android_tag }}
          VERSION_NAME: ${{ steps.android_release.outputs.version_name }}
          VERSION_CODE: ${{ steps.android_release.outputs.version_code }}
          APK_SHA256: ${{ steps.apk.outputs.sha256 }}
          RELEASE_NOTES_PATH: ${{ steps.release_notes.outputs.notes_path }}
        run: |
          test -n "$GITEE_TOKEN"
          test -n "$GITHUB_PUSH_TOKEN"
          mirror_dir="$RUNNER_TEMP/android-latest"
          mkdir -p "$mirror_dir"
          split -b 4m -d -a 3 "$APK_PATH" "$mirror_dir/$APK_NAME.part-"
          gitee_parts="$(find "$mirror_dir" -maxdepth 1 -type f -name "$APK_NAME.part-*" -printf '%f\n' \
            | sort \
            | sed 's#^#https://gitee.com/pq125pq/rp-hub-app/raw/android-latest/#' \
            | jq -R . | jq -s .)"
          github_apk_url="https://github.com/${{ github.repository }}/releases/download/${ANDROID_TAG}/${APK_NAME}"
          jq -n \
            --arg versionName "$VERSION_NAME" \
            --argjson versionCode "$VERSION_CODE" \
            --arg tag "$ANDROID_TAG" \
            --rawfile notes "$RELEASE_NOTES_PATH" \
            --arg apkName "$APK_NAME" \
            --argjson giteeParts "$gitee_parts" \
            --arg githubApkUrl "$github_apk_url" \
            --argjson apkSize "$(stat -c %s "$APK_PATH")" \
            --arg apkSha256 "$APK_SHA256" \
            '{schemaVersion: 1, versionName: $versionName, versionCode: $versionCode, tag: $tag, notes: $notes, apk: {name: $apkName, sources: [[$githubApkUrl], $giteeParts], size: $apkSize, sha256: $apkSha256}}' \
            > "$mirror_dir/android-update.json"

          git -C "$mirror_dir" init
          git -C "$mirror_dir" checkout -b android-latest
          git -C "$mirror_dir" config user.name "github-actions[bot]"
          git -C "$mirror_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$mirror_dir" add "$APK_NAME".part-* android-update.json
          git -C "$mirror_dir" commit -m "release: publish Android ${ANDROID_TAG} distribution"
          mirror_sha="$(git -C "$mirror_dir" rev-parse HEAD)"
          git -C "$mirror_dir" remote add origin https://github.com/${{ github.repository }}.git

          askpass="$RUNNER_TEMP/github-push-askpass.sh"
          printf '%s\n' \
            '#!/bin/sh' \
            'case "$1" in' \
            '  *Username*) printf "%s\\n" "x-access-token" ;;' \
            '  *Password*) printf "%s\\n" "$GITHUB_PUSH_TOKEN" ;;' \
            '  *) exit 1 ;;' \
            'esac' > "$askpass"
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            git -C "$mirror_dir" push --force origin HEAD:refs/heads/android-latest

          curl --silent --show-error --fail-with-body \
            --connect-timeout 20 --max-time 60 \
            --request POST --get \
            --data-urlencode "access_token=$GITEE_TOKEN" \
            "https://gitee.com/api/v5/repos/pq125pq/rp-hub-app/remote_mirror/pull" \
            > "$RUNNER_TEMP/gitee-mirror-pull.json"

          for attempt in $(seq 1 30); do
            gitee_sha="$(git ls-remote https://gitee.com/pq125pq/rp-hub-app.git refs/heads/android-latest | cut -f1)"
            if [ "$gitee_sha" = "$mirror_sha" ]; then
              curl --silent --show-error --fail --location --head \
                --connect-timeout 15 --max-time 30 \
                "https://gitee.com/pq125pq/rp-hub-app/raw/android-latest/android-update.json" >/dev/null
              exit 0
            fi
            sleep 10
          done
          echo "Gitee mirror did not reach android-latest commit $mirror_sha" >&2
          exit 1

      - name: Open GitHub issue on sync failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_MODE: ${{ steps.upstream_sync.outputs.sync_mode }}
          UPSTREAM_SHA: ${{ steps.upstream_sync.outputs.upstream_sha }}
          UPSTREAM_RELEASE_TAG: ${{ steps.upstream_sync.outputs.release_tag }}
        run: |
          # Identify the first failed step by checking outcomes of steps with ids,
          # in workflow order. Steps without ids cannot report outcomes; fall back
          # to "unknown" and rely on run logs for those.
          failed_step="unknown"
          for outcome in \
            "upstream_sync:${{ steps.upstream_sync.outcome }}" \
            "android_release:${{ steps.android_release.outcome }}" \
            "apk:${{ steps.apk.outcome }}" \
            "release_notes:${{ steps.release_notes.outcome }}"; do
            step_id="${outcome%%:*}"
            step_outcome="${outcome#*:}"
            if [ "$step_outcome" = "failure" ]; then
              failed_step="$step_id"
              break
            fi
          done

          new_sha="${UPSTREAM_SHA:-unknown-sha}"
          short_new="${new_sha:0:12}"
          previous_head="$(git rev-parse HEAD 2>/dev/null || echo unknown)"
          short_old="${previous_head:0:12}"

          title="[sync-upstream] upstream ${short_new} (was ${short_old}) failed at step: ${failed_step}"
          search_query="in:title \"upstream ${short_new}\" \"failed at step: ${failed_step}\""

          body_file="$RUNNER_TEMP/sync-failure-issue.md"
          {
            echo "## sync-upstream workflow failure"
            echo
            echo "- **Failed step (first with failure outcome):** \`$failed_step\`"
            echo "- **Sync mode:** \`${SYNC_MODE:-unknown}\`"
            echo "- **Target upstream SHA:** \`$new_sha\`"
            echo "- **Target upstream tag:** \`${UPSTREAM_RELEASE_TAG:-unknown}\`"
            echo "- **Local HEAD at failure (old SHA):** \`$previous_head\`"
            echo "- **Run URL:** <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}>"
            echo
            echo "### git status (truncated)"
            echo
            echo '```'
            git status 2>&1 | head -n 40
            echo '```'
            echo
            echo "### Conflicted files (git diff --name-only --diff-filter=U)"
            echo
            echo '```'
            git diff --name-only --diff-filter=U 2>&1 | head -n 50
            echo '```'
            echo
            echo "### Recent git log"
            echo
            echo '```'
            git log --oneline -n 20 2>&1
            echo '```'
            echo
            echo "See the run logs for the authoritative error output."
          } > "$body_file"

          existing_issue="$(gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --search "$search_query" \
            --limit 1 \
            --json number \
            --jq '.[0].number // ""')"

          if [ -n "$existing_issue" ]; then
            gh issue comment "$existing_issue" \
              --repo "${{ github.repository }}" \
              --body-file "$body_file"
            echo "Duplicate failure detected; commented on existing issue #$existing_issue"
          else
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "$title" \
              --body-file "$body_file"
            echo "Created new sync-failure issue: $title"
          fi
